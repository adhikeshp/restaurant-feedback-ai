services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurant_feedback
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://restaurant:restaurant@db:5432/restaurant_feedback
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
